<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vận Đơn Scanner">
<title>Vận Đơn Scanner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#2c2c2a;--accent-dark:#1a1a18;
  --bg:#f5f5f3;--surface:#fff;--surface2:#f0efeb;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --text:#1a1a18;--text2:#6b6b67;--text3:#a3a39e;
  --ok-bg:#eaf3de;--ok-text:#3b6d11;--ok-border:rgba(59,109,17,0.25);
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --err-bg:#fcebeb;--err-text:#a32d2d;
  --r:10px;--rl:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--surface:#252523;--surface2:#2e2e2c;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --text:#f0efe9;--text2:#a3a39e;--text3:#6b6b67;
  --ok-bg:#173404;--ok-text:#97c459;--ok-border:rgba(99,153,34,0.3);
  --warn-bg:#412402;--warn-text:#ef9f27;
  --err-bg:#501313;--err-text:#f09595;
}}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg)}

/* Header */
.header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo i{color:#fff;font-size:19px}
.header-text h1{font-size:16px;font-weight:600;color:var(--text)}
.header-text p{font-size:12px;color:var(--text2);margin-top:1px}
.badge{margin-left:auto;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;min-width:26px;text-align:center}

/* Body */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Scanner card */
.scanner-card{background:var(--surface);border-radius:var(--rl);border:0.5px solid var(--border);overflow:hidden}
.cam-placeholder{padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.cam-placeholder i{font-size:44px;color:var(--text3)}
.cam-placeholder p{font-size:15px;font-weight:500;color:var(--text2)}
.cam-placeholder span{font-size:12px;color:var(--text3)}
.cam-wrapper{position:relative;width:100%;aspect-ratio:1;background:#000}
#reader-video{width:100%;height:100%;object-fit:cover;display:block}
.scan-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.scan-frame{width:70%;height:40%;position:relative}
.c-tl,.c-tr,.c-bl,.c-br{position:absolute;width:22px;height:22px;border-color:#fff;border-style:solid}
.c-tl{top:0;left:0;border-width:3px 0 0 3px}
.c-tr{top:0;right:0;border-width:3px 3px 0 0}
.c-bl{bottom:0;left:0;border-width:0 0 3px 3px}
.c-br{bottom:0;right:0;border-width:0 3px 3px 0}
.scan-line{position:absolute;width:80%;left:10%;height:2px;background:rgba(220,50,30,0.85);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:10%}50%{top:82%}}
.scan-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.75);font-size:12px;pointer-events:none}

.scanner-actions{padding:10px;display:flex;flex-direction:column;gap:8px}
.btn-primary{width:100%;padding:13px;border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff}
.btn-primary:active{opacity:0.8}
.btn-secondary{width:100%;padding:11px;border:0.5px solid var(--border2);border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--text)}
.btn-secondary:active{opacity:0.75}
.result-flash{padding:10px 13px;border-radius:var(--r);font-size:13px;display:flex;align-items:center;gap:8px}
.result-ok{background:var(--ok-bg);color:var(--ok-text);border:0.5px solid var(--ok-border)}
.result-warn{background:var(--warn-bg);color:var(--warn-text)}
.result-err{background:var(--err-bg);color:var(--err-text)}

/* Manual */
.manual-card{background:var(--surface);border-radius:var(--rl);border:0.5px solid var(--border);padding:12px}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px}
.manual-row{display:flex;gap:8px}
.manual-row input{flex:1;padding:10px 12px;border:0.5px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--surface2);color:var(--text);outline:none}
.manual-row input:focus{border-color:var(--accent)}
.manual-row button{padding:10px 14px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer}
.manual-row button:active{opacity:0.75}

/* List */
.list-card{background:var(--surface);border-radius:var(--rl);border:0.5px solid var(--border);flex:1;min-height:180px;overflow:hidden;display:flex;flex-direction:column}
.list-header{padding:12px 14px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);flex-shrink:0}
.list-header h2{font-size:14px;font-weight:500;color:var(--text2)}
.list-actions{display:flex;gap:6px}
.btn-export{font-size:12px;color:var(--text2);background:var(--surface2);border:0.5px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:4px}
.btn-clr{font-size:12px;color:#c22a1a;background:none;border:none;cursor:pointer;padding:5px 8px;border-radius:8px}
.list-inner{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px}
.empty-state{text-align:center;padding:40px 16px;color:var(--text3);font-size:13px}
.empty-state i{font-size:36px;display:block;margin-bottom:10px}
.order-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg);margin-bottom:6px}
.order-num{width:26px;height:26px;border-radius:50%;background:var(--surface2);font-size:11px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.order-info{flex:1;min-width:0}
.order-code{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Menlo','Courier New',monospace;letter-spacing:0.3px}
.order-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:6px}
.carrier-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px}
.c-vtp{background:#fff0ee;color:#c22a1a}
.c-ghtk{background:#eaf3de;color:#3b6d11}
.c-other{background:var(--surface2);color:var(--text3)}
.copy-btn{flex-shrink:0;padding:6px 11px;background:var(--surface2);border:0.5px solid var(--border);border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--text2)}
.copy-btn.copied{background:var(--ok-bg);color:var(--ok-text);border-color:var(--ok-border)}
.order-full{font-size:10px;color:var(--text3);font-family:'Menlo','Courier New',monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hidden file input */
#photo-input{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo"><i class="ti ti-package"></i></div>
    <div class="header-text">
      <h1>Vận Đơn Scanner</h1>
      <p>GHTK · Viettel Post</p>
    </div>
    <div class="badge" id="count-badge">0</div>
  </div>

  <div class="body">
    <div class="scanner-card">
      <div id="cam-area">
        <div class="cam-placeholder" onclick="startScan()">
          <i class="ti ti-scan"></i>
          <p>Nhấn để mở camera</p>
          <span>GHTK · Viettel Post · QR &amp; Barcode</span>
        </div>
      </div>
      <div class="scanner-actions">
        <div id="scan-result" style="display:none"></div>
        <button class="btn-primary" id="main-btn" onclick="startScan()">
          <i class="ti ti-camera"></i> Bắt đầu quét
        </button>
        <button class="btn-secondary" onclick="document.getElementById('photo-input').click()">
          <i class="ti ti-photo"></i> Quét từ ảnh / thư viện
        </button>
        <input type="file" id="photo-input" accept="image/*" onchange="scanFromPhoto(this)">
      </div>
    </div>

    <div class="manual-card">
      <div class="section-label">Nhập thủ công</div>
      <div class="manual-row">
        <input type="text" id="manual-input" placeholder="Nhập mã vận đơn..." autocomplete="off">
        <button onclick="addManual()"><i class="ti ti-plus"></i> Thêm</button>
      </div>
    </div>

    <div class="list-card">
      <div class="list-header">
        <h2>Danh sách đã quét</h2>
        <div class="list-actions">
          <button class="btn-export" onclick="exportCSV()"><i class="ti ti-download" style="font-size:14px"></i> CSV</button>
          <button class="btn-clr" onclick="clearAll()"><i class="ti ti-trash" style="font-size:14px"></i> Xoá</button>
        </div>
      </div>
      <div class="list-inner" id="order-list">
        <div class="empty-state"><i class="ti ti-inbox"></i>Chưa có mã nào.<br>Quét để bắt đầu!</div>
      </div>
    </div>
  </div>
</div>

<!-- ZXing: mạnh hơn với barcode 1D -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
const STORAGE_KEY = 'vandon_orders';
let orders = [];
try { orders = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}

let codeReader = null;
let scanning = false;
let currentStream = null;

/* ── Carrier detection ── */
function detectCarrier(code) {
  const c = code.toUpperCase();
  if (/^(SBVD|BVHD|PHVD|VDHLOG|VTPCO|VTPOST|VTP\d)/.test(c)) return 'Viettel Post';
  // Viettel URL QR → extract code
  if (c.includes('VIETTELPOST') || c.includes('VIETTEL-POST')) return 'Viettel Post';
  if (/^(S|J|P|TDM|GHTK|GHN)/.test(c) && c.length >= 10) return 'GHTK';
  return '';
}

/* Trích mã DHLOG từ chuỗi bất kỳ */
function extractDHLOG(str) {
  const m = str.toUpperCase().match(/DHLOG[A-Z0-9]+/);
  return m ? m[0] : null;
}

/* Parse mã quét → trả về {full, dhlog} */
function extractCode(raw) {
  let base = raw.trim();
  try {
    const url = new URL(raw);
    const fromParam = url.searchParams.get('code') || url.searchParams.get('orderCode') || url.searchParams.get('waybill');
    if (fromParam) base = fromParam.trim();
    else {
      const parts = url.pathname.split('/').filter(Boolean);
      const last = parts[parts.length - 1];
      if (last && last.length >= 8) base = last.trim();
    }
  } catch(e) {}
  return { full: base, dhlog: extractDHLOG(base) };
}

/* ── Storage ── */
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); } catch(e) {} }

/* ── Render ── */
function renderList() {
  document.getElementById('count-badge').textContent = orders.length;
  const el = document.getElementById('order-list');
  if (!orders.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-inbox"></i>Chưa có mã nào.<br>Quét để bắt đầu!</div>';
    return;
  }
  el.innerHTML = orders.map((o, i) => {
    const carrier = o.carrier || detectCarrier(o.dhlog || o.code);
    const bc = carrier === 'Viettel Post' ? 'c-vtp' : carrier === 'GHTK' ? 'c-ghtk' : 'c-other';
    const badgeHtml = carrier ? `<span class="carrier-badge ${bc}">${carrier}</span>` : '';
    // Hiển thị DHLOG to, mã gốc nhỏ bên dưới nếu khác
    const mainCode = o.dhlog || o.code;
    const subCode = (o.dhlog && o.dhlog !== o.code) ? o.code : null;
    const copyTarget = mainCode;
    return `<div class="order-card">
      <div class="order-num">${orders.length - i}</div>
      <div class="order-info">
        <div class="order-code">${esc(mainCode)}</div>
        ${subCode ? `<div class="order-full">${esc(subCode)}</div>` : ''}
        <div class="order-meta">${o.time} ${badgeHtml}</div>
      </div>
      <button class="copy-btn" id="cb${i}" onclick="copyCode('${escA(copyTarget)}',${i})">
        <i class="ti ti-copy" style="font-size:14px"></i> Copy
      </button>
    </div>`;
  }).join('');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* ── Result flash ── */
function showResult(msg, type='ok') {
  const el = document.getElementById('scan-result');
  el.style.display = 'flex';
  el.className = 'result-flash result-' + type;
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

/* ── Add code ── */
function addCode(raw) {
  const { full, dhlog } = extractCode(raw);
  if (!full || full.length < 4) return;
  // Dùng DHLOG làm key dedup nếu có, không thì dùng full
  const key = dhlog || full;
  if (orders.find(o => (o.dhlog || o.code) === key)) {
    showResult('⚠ Mã này đã có trong danh sách', 'warn'); return;
  }
  const now = new Date();
  const time = now.toLocaleString('vi-VN', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});
  const carrier = detectCarrier(dhlog || full);
  orders.unshift({ code: full, dhlog: dhlog || null, time, carrier });
  save(); renderList();
  const display = dhlog || full;
  showResult('✓ Đã thêm: ' + display + (carrier ? ' (' + carrier + ')' : ''), 'ok');
  if (navigator.vibrate) navigator.vibrate(60);
}

function addManual() {
  const inp = document.getElementById('manual-input');
  if (inp.value.trim()) { addCode(inp.value); inp.value = ''; }
}
document.getElementById('manual-input').addEventListener('keydown', e => { if (e.key === 'Enter') addManual(); });

/* ── Copy ── */
function copyCode(code, idx) {
  const btn = document.getElementById('cb' + idx);
  const done = () => {
    if (!btn) return;
    btn.classList.add('copied');
    btn.innerHTML = '<i class="ti ti-check" style="font-size:14px"></i> Đã copy';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<i class="ti ti-copy" style="font-size:14px"></i> Copy'; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(() => fbCopy(code, done));
  } else fbCopy(code, done);
}
function fbCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta); if (cb) cb();
}

/* ── Clear / Export ── */
function clearAll() {
  if (!orders.length) return;
  if (confirm('Xoá tất cả ' + orders.length + ' mã?')) { orders = []; save(); renderList(); }
}
function exportCSV() {
  if (!orders.length) { alert('Chưa có mã nào.'); return; }
  const rows = [['STT','Mã DHLOG','Mã vận đơn đầy đủ','Đơn vị','Thời gian']].concat(
    orders.map((o,i) => [orders.length-i, o.dhlog||o.code, o.code, o.carrier||detectCarrier(o.dhlog||o.code)||'', o.time])
  );
  const csv = '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  a.download = 'vandon_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

/* ── ZXing scan from live camera ── */
function setBtn(label, icon, fn, isStop) {
  const btn = document.getElementById('main-btn');
  btn.className = isStop ? 'btn-secondary' : 'btn-primary';
  btn.innerHTML = `<i class="ti ${icon}"></i> ${label}`;
  btn.onclick = fn;
}

async function startScan() {
  if (scanning) return;

  // Khởi tạo ZXing hints — ưu tiên các định dạng hay dùng
  const hints = new Map();
  const formats = [
    ZXing.BarcodeFormat.QR_CODE,
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.ITF,
    ZXing.BarcodeFormat.DATA_MATRIX,
    ZXing.BarcodeFormat.PDF_417,
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

  codeReader = new ZXing.BrowserMultiFormatReader(hints, 300);

  const area = document.getElementById('cam-area');
  area.innerHTML = `
    <div class="cam-wrapper">
      <video id="reader-video" autoplay playsinline muted></video>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="c-tl"></div><div class="c-tr"></div>
          <div class="c-bl"></div><div class="c-br"></div>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="scan-hint">Đưa barcode hoặc QR vào khung</div>
    </div>`;

  setBtn('Dừng quét', 'ti-camera-off', stopScan, true);
  scanning = true;

  try {
    const videoEl = document.getElementById('reader-video');
    // Dùng camera sau, độ phân giải cao
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    currentStream = stream;
    videoEl.srcObject = stream;

    codeReader.decodeFromStream(stream, videoEl, (result, err) => {
      if (result) {
        addCode(result.getText());
      }
    });
  } catch(err) {
    scanning = false;
    area.innerHTML = `<div class="cam-placeholder" onclick="startScan()">
      <i class="ti ti-camera-off"></i>
      <p>Không thể mở camera</p>
      <span>${err.message || 'Kiểm tra quyền truy cập camera'}</span>
    </div>`;
    setBtn('Thử lại', 'ti-refresh', startScan, false);
  }
}

function stopScan() {
  scanning = false;
  if (codeReader) { try { codeReader.reset(); } catch(e) {} codeReader = null; }
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  const area = document.getElementById('cam-area');
  area.innerHTML = `<div class="cam-placeholder" onclick="startScan()">
    <i class="ti ti-scan"></i>
    <p>Nhấn để mở camera</p>
    <span>GHTK · Viettel Post · QR &amp; Barcode</span>
  </div>`;
  setBtn('Bắt đầu quét', 'ti-camera', startScan, false);
}

/* ── Scan from photo (fallback) ── */
async function scanFromPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.ITF,
    ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.PDF_417,
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

  const reader = new ZXing.BrowserMultiFormatReader(hints);
  try {
    const url = URL.createObjectURL(file);
    const result = await reader.decodeFromImageUrl(url);
    URL.revokeObjectURL(url);
    if (result) addCode(result.getText());
  } catch(e) {
    showResult('Không tìm thấy mã trong ảnh. Thử chụp rõ hơn.', 'err');
  }
}

renderList();
</script>
</body>
</html>
